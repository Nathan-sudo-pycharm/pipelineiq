services:
  postgres:
    image: postgres:16
    container_name: pipelineiq_postgres
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./app/db/schema.sql:/docker-entrypoint-initdb.d/schema.sql

  redis:
    image: redis:7
    container_name: pipelineiq_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

  app:
    build: .
    container_name: pipelineiq_app
    restart: unless-stopped
    env_file: .env
    ports:
      - "8080:8000"
    depends_on:
      - postgres
      - redis

  worker:
    build: .
    container_name: pipelineiq_worker
    restart: unless-stopped
    env_file: .env
    # Override the default CMD to run the worker instead of the API
    command: ["python", "-m", "workers.consumer"]
    depends_on:
      - postgres
      - redis

volumes:
  postgres_data:
  redis_data:
